name: Reading path

# Dogfooding the action this repository publishes. Every pull request gets the
# files that hold the project together, both in the job summary and as a comment,
# so a reviewer sees exactly what a newcomer would see.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # the action edits one comment in place

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the churn signal needs real history
      - uses: ./           # the action defined in this repository
        with:
          top: "15"
          comment: "true"
