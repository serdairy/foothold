name: ARCHITECTURE.md is current

# Foothold documents itself. If the committed ARCHITECTURE.md no longer matches what
# `foothold docs` produces, the structure of the project moved and the document lied.
#
# This is a check, not a bot: it needs no write permission and opens no pull requests.
# A red run here means "run `uv run foothold docs . --out ARCHITECTURE.md` and commit".

on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the churn signal needs real history
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run foothold docs . --out ARCHITECTURE.md
      - name: Fail if the generated document drifted
        run: |
          if ! git diff --exit-code -- ARCHITECTURE.md; then
            echo "::error::ARCHITECTURE.md is stale. Run: uv run foothold docs . --out ARCHITECTURE.md"
            exit 1
          fi
          echo "ARCHITECTURE.md matches the current structure."
