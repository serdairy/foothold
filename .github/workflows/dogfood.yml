name: Regenerate ARCHITECTURE.md

on:
  push: { branches: [main] }
  schedule: [{ cron: "0 6 * * 1" }]

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run foothold docs . --out ARCHITECTURE.md
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: regenerate ARCHITECTURE.md"
          title: "docs: regenerate ARCHITECTURE.md"
          body: |
            Generated by `foothold docs` on this commit.
            A diff here means the structure of the project moved. Review it as such.
          branch: chore/regenerate-architecture
          delete-branch: true
