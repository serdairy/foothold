version: 2

updates:
  # This repository shipped a red CI once because a workflow pinned
  # astral-sh/setup-uv@v9, a moving major tag that project never published.
  # Dependabot resolves references against the real registry, so it finds that
  # class of mistake before a push does. It watches .github/workflows and the
  # action.yml at the root, which is what we actually publish.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # One pull request for all of them. Five separate bumps a week is how a
      # solo maintainer learns to ignore the bot.
      actions:
        patterns:
          - "*"
