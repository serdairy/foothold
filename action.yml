name: Foothold reading path
description: Rank the files that hold a Python repository together, and put the reading path in the job summary.
author: Sergei Petrov

branding:
  icon: map
  color: green

inputs:
  path:
    description: Repository root to analyse.
    required: false
    default: "."
  command:
    description: "One of: map, docs, issues."
    required: false
    default: map
  top:
    description: How many files to report.
    required: false
    default: "20"
  output:
    description: File to write when command is `docs`.
    required: false
    default: ARCHITECTURE.md
  version:
    description: 'Version of foothold to install, e.g. "0.1.2". Empty installs the latest.'
    required: false
    default: ""
  since:
    description: >-
      Restrict the reading path to files changed since a git ref. Use "auto" to
      compare against the pull request's base branch.
    required: false
    default: ""
  summary:
    description: Write the result to the GitHub job summary.
    required: false
    default: "true"
  comment:
    description: >-
      Post the result as a single comment on the pull request, edited in place on
      later pushes. Needs `permissions: pull-requests: write`. Ignored outside
      pull requests.
    required: false
    default: "false"
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}
  cache:
    description: >-
      Restore and save foothold's parse cache between runs. Parsing is most of
      the cost, so this is the difference between four seconds and half a second
      on a large repository.
    required: false
    default: "true"
  fetch-history:
    description: >-
      Deepen a shallow checkout so the churn signal has commits to read. Set to
      "false" on very large repositories where the extra fetch is not worth it.
    required: false
    default: "true"
  python-version:
    description: Python used to run foothold. Independent of the analysed project.
    required: false
    default: "3.12"

outputs:
  result:
    description: The command output as plain text.
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - name: Set up Python for foothold
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install foothold
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ]; then
          python -m pip install --quiet "foothold==$VERSION"
        else
          python -m pip install --quiet foothold
        fi
        foothold --version

    # actions/checkout clones at depth 1 by default. With no history `git log`
    # returns nothing, the churn signal is uniformly zero, and the ranking quietly
    # degrades to a plain import graph. Say so out loud rather than returning a
    # worse answer that looks like a normal one.
    - name: Make sure the churn signal has history
      shell: bash
      env:
        REPO_PATH: ${{ inputs.path }}
        FETCH_HISTORY: ${{ inputs.fetch-history }}
      run: |
        set -uo pipefail
        dir="$REPO_PATH"
        if ! git -C "$dir" rev-parse --git-dir >/dev/null 2>&1; then
          echo "::warning title=No git history::'$dir' is not a git repository. Files will be ranked by the import graph alone."
          exit 0
        fi
        if [ "$(git -C "$dir" rev-parse --is-shallow-repository)" != "true" ]; then
          exit 0
        fi
        if [ "$FETCH_HISTORY" != "true" ]; then
          echo "::warning title=Shallow checkout::History was not fetched, so the churn signal is empty and ranking falls back to the import graph alone."
          exit 0
        fi
        echo "Shallow checkout detected; deepening it so the churn signal has commits to read."
        if ! git -C "$dir" fetch --unshallow --quiet 2>/dev/null; then
          echo "::warning title=Shallow checkout::Could not deepen the checkout. Ranking falls back to the import graph alone. Add 'fetch-depth: 0' to actions/checkout to fix this."
        fi

    - name: Restore the parse cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/foothold
        # Content-addressed entries, so a cache from any earlier commit is still
        # correct: unchanged files hit, changed files are re-parsed.
        key: foothold-${{ runner.os }}-${{ inputs.python-version }}-${{ github.sha }}
        restore-keys: |
          foothold-${{ runner.os }}-${{ inputs.python-version }}-

    - name: Resolve the diff base
      id: since
      shell: bash
      env:
        SINCE: ${{ inputs.since }}
        REPO_PATH: ${{ inputs.path }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -uo pipefail
        value="$SINCE"
        if [ "$value" = "auto" ]; then
          if [ "$EVENT_NAME" = "pull_request" ]; then
            value="origin/$BASE_REF"
            git -C "$REPO_PATH" fetch --quiet origin "$BASE_REF" 2>/dev/null || true
          else
            echo "::notice::since=auto only applies to pull requests; showing the whole map."
            value=""
          fi
        fi
        printf 'ref=%s\n' "$value" >> "$GITHUB_OUTPUT"

    - name: Run foothold
      id: run
      shell: bash
      env:
        # rich wraps to the terminal width; fix it so the summary is stable.
        COLUMNS: "110"
        REPO_PATH: ${{ inputs.path }}
        COMMAND: ${{ inputs.command }}
        TOP: ${{ inputs.top }}
        OUTPUT: ${{ inputs.output }}
        SINCE_REF: ${{ steps.since.outputs.ref }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/foothold-out.txt"
        printf 'FOOTHOLD_OUT=%s\n' "$out" >> "$GITHUB_ENV"
        case "$COMMAND" in
          map)
            if [ -n "$SINCE_REF" ]; then
              foothold map "$REPO_PATH" --top "$TOP" --since "$SINCE_REF" | tee "$out"
            else
              foothold map "$REPO_PATH" --top "$TOP" | tee "$out"
            fi
            ;;
          issues) foothold issues "$REPO_PATH" --max "$TOP" --markdown | tee "$out" ;;
          docs)   foothold docs   "$REPO_PATH" --out "$OUTPUT" --top "$TOP" | tee "$out" ;;
          *)      echo "::error::Unknown command '$COMMAND'. Use map, docs or issues."; exit 1 ;;
        esac
        {
          echo "result<<FOOTHOLD_EOF"
          cat "$out"
          echo "FOOTHOLD_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Write the job summary
      if: ${{ inputs.summary == 'true' }}
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
      run: |
        {
          echo "## Foothold"
          echo
          if [ "$COMMAND" = "issues" ]; then
            cat "$FOOTHOLD_OUT"
          else
            echo '```'
            cat "$FOOTHOLD_OUT"
            echo '```'
          fi
          echo
          echo "_Ranked by import graph and git churn. Checkout needs \`fetch-depth: 0\` for the churn signal._"
        } >> "$GITHUB_STEP_SUMMARY"

    # One comment, edited in place. A bot that appends a new comment on every push
    # is the reason maintainers switch bots off.
    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -uo pipefail
        marker='<!-- foothold-reading-path -->'
        body="${RUNNER_TEMP}/foothold-comment.md"
        {
          echo "$marker"
          echo "## Foothold reading path"
          echo
          if [ "$COMMAND" = "issues" ]; then
            cat "$FOOTHOLD_OUT"
          else
            echo '```'
            cat "$FOOTHOLD_OUT"
            echo '```'
          fi
          echo
          echo "_Ranked by import graph and git churn._"
        } > "$body"

        # GitHub rejects comments over 65,536 characters. Truncating with a
        # visible note beats a 422 and no comment at all.
        limit=60000
        if [ "$(wc -c < "$body")" -gt "$limit" ]; then
          head -c "$limit" "$body" > "$body.cut"
          {
            printf '\n```\n\n_Truncated to fit a GitHub comment. '
            printf 'The full reading path is in the job summary._\n'
          } >> "$body.cut"
          mv "$body.cut" "$body"
        fi

        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -1)

        if [ -n "${existing:-}" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$body" >/dev/null \
            || echo "::warning title=Comment not updated::Could not edit the existing comment. The result is still in the job summary."
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$body" >/dev/null \
            || echo "::warning title=Comment not posted::Could not post a comment. Pull requests from forks get a read-only token; for same-repository pull requests add 'permissions: pull-requests: write'. The result is still in the job summary."
        fi
