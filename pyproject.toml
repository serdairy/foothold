[project]
name = "foothold"
version = "0.1.3"
description = "Turn an unfamiliar repository into a reading path"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sergei Petrov", email = "pserg@me.com" }]
keywords = ["cli", "onboarding", "static-analysis", "developer-tools", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["typer>=0.12", "rich>=13.7", "networkx>=3.1"]

[project.optional-dependencies]
narrate = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/serdairy/foothold"
Issues = "https://github.com/serdairy/foothold/issues"
Changelog = "https://github.com/serdairy/foothold/blob/main/CHANGELOG.md"

[project.scripts]
foothold = "foothold.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foothold"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: typer.Option/Argument in defaults is the documented Typer idiom.
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/foothold"]

[[tool.mypy.overrides]]
module = ["networkx.*", "openai.*", "tomli.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
markers = ["e2e: requires OPENAI_API_KEY and network"]
